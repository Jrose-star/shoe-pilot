server {
    listen 80;
    server_name _;  # 接受任意域名，实际部署时可替换为你的域名

    root /usr/share/nginx/html;
    index index.html;

    # 处理 Vue Router history 模式：所有前端路由都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 API 请求到后端容器
    location /api/ {
        # "backend" 是 docker-compose 中定义的后端服务名
        proxy_pass http://backend:8000/api/;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- Agent 项目特别提醒 ----
        # 如果你的 Agent 使用 SSE (Server-Sent Events) 进行流式输出，
        # 必须关闭代理缓冲，否则前端会收不到实时数据：
        # proxy_buffering off;
        # proxy_cache off;
        # proxy_read_timeout 300s;  # 根据 Agent 响应时间调整

        # 如果使用 WebSocket，还需添加：
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}