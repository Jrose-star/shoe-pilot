version: "3.9"

services:
  backend:
    build: ./backend
    container_name: agent-backend
    # 后端端口不直接暴露给宿主机，仅让前端 Nginx 在内部网络访问，更安全
    expose:
      - "8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY} # 按需传入大模型密钥
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agent-frontend
    ports:
      - "80:80" # 宿主机 80 端口映射到 Nginx
    depends_on:
      - backend
    restart: unless-stopped
